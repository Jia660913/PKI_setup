<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cybersecurity PKI Operation</title>
    <link rel="stylesheet" href="./dynamic-home.css" />
  </head>
  <body>
    <main class="cover-stage" aria-label="Cybersecurity PKI Operation dynamic cover">
      <img
        class="cover-image"
        src="./assets/cybersecurity-pki-cover.png"
        alt="Cybersecurity PKI Operation cover"
      />

      <canvas id="particleCanvas" class="particle-canvas" aria-hidden="true"></canvas>

      <div class="light-breath" aria-hidden="true"></div>
      <div class="scan-glow" aria-hidden="true"></div>

      <section class="title-light" aria-hidden="true">
        <h1>
          <span>Cybersecurity</span>
          <span>PKI Operation</span>
        </h1>
      </section>

      <div class="hud-core" aria-hidden="true">
        <span class="ring ring-a"></span>
        <span class="ring ring-b"></span>
        <span class="ring ring-c"></span>
        <span class="pulse-dot dot-top"></span>
        <span class="pulse-dot dot-right"></span>
        <span class="pulse-dot dot-bottom"></span>
        <span class="pulse-dot dot-left"></span>
      </div>
    </main>

    <script src="./dynamic-home.js"></script>
  </body>
</html>
